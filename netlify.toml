[build]
  command = "pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "pnpm dev"
  port = 3000

# Les variables sensibles doivent être configurées dans Netlify, jamais dans ce dépôt.
# DATABASE_URL doit être fournie par l’environnement de déploiement.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
